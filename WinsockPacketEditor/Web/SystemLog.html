<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0a0f">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>日志 · WPE x64</title>
    <!--
      站点图标 = <b>程序自己的那枚</b>（exe 的 ApplicationIcon）。
      Web/wpe.ico 是 ../wpe.ico 的<b>子集</b>：只留 16/32/48 三层（浏览器用得到的），
      源图 361KB -> 14.7KB —— 256x256 那一层单独就 270KB，是给 Explorer 大图标用的，
      标签页图标一辈子用不到，整份带上等于每个访问者白下 361KB。
      ⚠️ 换了源图要重新生成：见 CLAUDE.md「管理台的站点图标」。
    -->
    <link rel="icon" href="./wpe.ico" sizes="48x48 32x32 16x16">
    <!-- 令牌在前、组件样式在后：tokens.css 与外壳的 Vue 界面是同一个源文件 -->
    <link rel="stylesheet" href="./tokens.css">
    <link rel="stylesheet" href="./wpe.css">
    <!--
        ⚠️ 这里<b>不能</b>加 defer。延迟脚本要等整份文档解析完才执行，
        而页尾那段内联脚本是解析到就跑的 —— 加了 defer 就会「内联先跑、
        wpe.js 后跑」，页面上是一片「—」加一个 poll is not defined。
        它只有 6KB 且与页面同机，同步加载的代价可以忽略。
    -->
    <script src="./wpe.js"></script>
</head>

<body>
    <div class="pcb"></div>
    <span class="cn tl"></span><span class="cn tr"></span>
    <span class="cn bl"></span><span class="cn br"></span>

    <header class="top">
        <div class="brand">WPE <small>x64</small></div>
        <nav class="nav">
            <a href="index.html">总览</a>
            <a href="ProxyAccount.html">账号</a>
            <a href="SystemLog.html">日志</a>
        </nav>
        <span class="led" id="led"></span>
    </header>

    <main class="wrap">
        <section class="card">
            <div class="hd">
                <h2>运行日志</h2>
                <span class="sub" id="cnt">—</span>
                <span class="grow"></span>
                <button class="btn" id="btnPause" type="button">暂停刷新</button>
            </div>

            <div class="bd">
                <div class="bar-tools">
                    <div class="seg" id="seg">
                        <button type="button" data-tab="sys" class="on">系统</button>
                        <button type="button" data-tab="proxy">代理</button>
                        <button type="button" data-tab="auth">认证</button>
                    </div>
                </div>
            </div>

            <table class="tbl log">
                <thead id="head"></thead>
                <tbody id="body"></tbody>
            </table>

            <div class="empty" id="empty" hidden>没有记录</div>
        </section>
    </main>

    <footer class="foot">WPE x64 · REMOTE CONSOLE</footer>
    <div class="toasts" id="toasts"></div>

    <script>
        'use strict';

        /*
            ⚠️ 只要最近 MAX 条：既作为请求参数（?take=），也作为渲染上限。
            C# 侧那三份列表默认留 5000 条，手机上一次铺 5000 行 × 3~7 格是几万个 DOM 节点。
            日志本来就是「往回翻最近发生了什么」，300 条够用。
        */
        var MAX = 300;

        /*
            三路日志各是一份不同的数据、不同的列 —— 不是一张表加个筛选。

            ⚠️ 「代理」这一路走的是 SocketInfo/GetProxyLogList。
            旧版这里调的是 ProxyInfo/GetProxyLogList，而那个端点 return 的是
            lstLogInfo（系统日志）—— 也就是说旧版的「代理日志」页签
            和「系统日志」页签显示的是<b>同一份数据</b>，是个一直没人发现的 bug。
            真正的代理日志（lstProxyLogInfo）在 SocketInfo 那个控制器下面。
        */
        var TABS = {
            sys: {
                url: 'SocketInfo/GetSocketLogList',
                cols: [['时间', 't'], ['模块', 'mod'], ['内容', '']],
                row: function (it) {
                    return [
                        ['时间', 't', time(it.LogTime)],
                        ['模块', 'mod', it.FuncName],
                        ['内容', '', it.LogContent],
                    ];
                },
            },
            proxy: {
                url: 'SocketInfo/GetProxyLogList',
                cols: [['时间', 't'], ['账号', 'who'], ['来源 IP', 'mod'], ['内容', '']],
                row: function (it) {
                    return [
                        ['时间', 't', time(it.LogTime)],
                        ['账号', 'who', it.UserName],
                        ['来源 IP', 'mod', it.LoginIP],
                        ['内容', '', it.LogContent],
                    ];
                },
            },
            /*
              ⚠️ <b>没有「结果」列</b>：全项目只有一处产生 AuthInfo，
              而那一处的 AuthResult 是写死的 true（Operate.cs 的 SetOnline_ByAccountID 那条路）——
              也就是说<b>认证没通过的根本不会进这张表</b>，那一列恒为「通过」，一个字的信息量都没有。
              哪天真要记下被拒的认证，得先让 C# 侧把 false 的那些也 Add 进来，再把这列加回来。
            */
            auth: {
                url: 'ProxyInfo/GetProxyAuthList',
                cols: [['时间', 't'], ['IP', 'mod'], ['归属地', ''],
                       ['连接数', 'num'], ['设备数', 'num'], ['流量', 'num']],
                row: function (it) {
                    return [
                        ['时间', 't', time(it.AuthTime)],
                        ['IP', 'mod', it.AuthIP],
                        ['归属地', '', it.IPLocation],
                        ['连接数', 'num', num(it.LinksNumber)],
                        ['设备数', 'num', num(it.DevicesNumber)],
                        ['流量', 'num', bytes(it.TrafficStatistics)],
                    ];
                },
            },
        };

        var tab = 'sys';
        var raw = [];

        function render() {
            var def = TABS[tab];
            var list = raw;

            // 最新的在最上面：手机上不该为了看最新一条先滑到底。
            // slice 留着当兜底 —— 万一哪天接口忽略了 take，这里仍然不会铺出几千行。
            list = list.slice(-MAX).reverse();

            var head = document.getElementById('head');
            head.textContent = '';
            var tr = el('tr');
            /*
              ⚠️ 表头要带上<b>与数据行同名的 class</b>（cols 是 [标题, class] 对）。
              对齐规则按 class 写、不按列号 —— 这几张表的列增删过好几轮，
              按 nth-child 写每次都要重编一串序号，漏一个就是某列悄悄跑偏。
            */
            def.cols.forEach(function (c) { tr.appendChild(el('th', { class: c[1] }, c[0])); });
            head.appendChild(tr);

            var body = document.getElementById('body');
            body.textContent = '';
            list.forEach(function (it) {
                var r = el('tr');
                def.row(it).forEach(function (cell) {
                    var td = el('td', { class: cell[1], 'data-k': cell[0] }, cell[2] || '—');
                    r.appendChild(td);
                });
                body.appendChild(r);
            });

            document.getElementById('empty').hidden = list.length > 0;
            document.getElementById('cnt').textContent = list.length + ' 条';
        }

        function refresh() {
            var want = tab;
            /*
                ⚠️ 一定要带上 take。这几个接口不传就返回<b>整份</b>列表（日志默认上限 5000 条）——
                一条 LogInfo 序列化出来约 152 字节，5000 条就是 742KB，3 秒一拍挂一小时约 870MB，
                而下面只画最近 MAX 条，传过来的九成多当场丢掉。手机用流量看日志时这一笔很贵。
            */
            api(TABS[tab].url + '?take=' + MAX).then(function (d) {
                // 请求在途时用户可能已经切了页签，回来的就不是这一路的数据了
                if (want !== tab) return;
                raw = Array.isArray(d) ? d : [];
                render();
            }).catch(function () { });
        }

        var timer = poll(refresh, 3000);

        document.getElementById('seg').addEventListener('click', function (e) {
            var b = e.target.closest('button[data-tab]');
            if (!b || b.dataset.tab === tab) return;
            Array.prototype.forEach.call(this.children, function (x) { x.classList.remove('on'); });
            b.classList.add('on');
            tab = b.dataset.tab;
            raw = [];
            render();
            timer.now();
        });

        document.getElementById('btnPause').addEventListener('click', function () {
            this.textContent = timer.toggle() ? '继续刷新' : '暂停刷新';
        });
    </script>
</body>

</html>
