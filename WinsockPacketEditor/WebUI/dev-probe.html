    textDuplicates: (q) => {
      const B = (h) => { const c = (h || '').replace(/[^0-9a-fA-F]/g, '').toUpperCase(); const o = []; for (let i = 0; i + 1 < c.length; i += 2) o.push(c.substr(i, 2)); return o };
      const A = B(q.a), Bb = B(q.b), min = Math.max(1, q.min | 0);
      const cands = [];
      let prev = new Array(Bb.length + 1).fill(0);
      for (let i = 0; i < A.length; i++) {
        const cur = new Array(Bb.length + 1).fill(0);
        for (let j = 0; j < Bb.length; j++) {
          if (A[i] !== Bb[j]) continue;
          const len = prev[j] + 1; cur[j + 1] = len;
          if (len < min) continue;
          if (i + 1 < A.length && j + 1 < Bb.length && A[i + 1] === Bb[j + 1]) continue;
          cands.push([i, j, len]);
        }
        prev = cur;
      }
      cands.sort((x, y) => y[2] - x[2]);
      const uA = new Array(A.length).fill(false), uB = new Array(Bb.length).fill(false);
      // 同一个序列只列一行（贪心挑的是「一次出现」，同一段出现多次会被收下好几条）
      const seen = new Set();
      const occ = (hay, needle) => { const o = []; for (let i = 0; i + needle.length <= hay.length; i++) { let k = 0; while (k < needle.length && hay[i + k] === needle[k]) k++; if (k === needle.length) o.push(i) } return o };
      const rows = [];
      for (const c of cands) {
        const len = c[2], as = c[0] - len + 1, bs = c[1] - len + 1;
        let bad = false;
        for (let k = 0; k < len; k++) if (uA[as + k] || uB[bs + k]) { bad = true; break }
        if (bad) continue;
        for (let k = 0; k < len; k++) { uA[as + k] = true; uB[bs + k] = true }
        const seq = A.slice(as, as + len);
        const key = seq.join(' ');
        if (seen.has(key)) continue;
        seen.add(key);
        const pa = occ(A, seq), pb = occ(Bb, seq);
        rows.push({ Sequence: key, Length: len, CountInA: pa.length, CountInB: pb.length, PositionsInA: pa, PositionsInB: pb });
      }
      rows.sort((x, y) => y.Length - x.Length);
      return { rows };

  const settingComp = { '#ps': ProcessSetting, '#ps0': ProcessSetting, '#psok': ProcessSetting, '#psauth': ProcessSetting,
    '#map': MapSetting, '#xp': ExtProxySetting, '#hk': HotkeySetting, '#bk': BackupSetting, '#rm': RemoteSetting,
    '#o-proxy': older[0], '#o-proxy0': older[0], '#o-list': older[1], '#o-leach': older[2], '#o-hook': older[3], '#o-sys': older[4], '#o-fw': older[5] }[location.hash]
  installTooltip()   //自绘悬停提示，产品里由 main.ts 装，这儿要自己来一次才验得到

  /*
    ⚠️ 跟着语言走的那两个令牌，产品里由 App.vue 的 watchEffect 写在 :root 上 ——
    探针页没有 App.vue，不补的话它们退回默认 1，<b>俄语 / 越南语下量到的标签列比产品窄</b>，
    于是「多语言会不会挤」在这儿永远验不准（这一屏第一次验就撞上了）。
  */
  watchEffect(() => {
    const wide = defOf(lang.value).wide
    document.documentElement.style.setProperty('--setf-kx', wide ? '1.3' : '1')
    document.documentElement.style.setProperty('--side-w', wide ? '228px' : '196px')
  })

  //验证脚本切语言的唯一入口：console 里自己 import 会拿到另一份模块状态（见上面那段）
  window.__lang = lang

  /*
    设置弹窗的多语言体检：七种语言各切一遍，量「自己滚不了却装不下」与「真的被省略号截了」。
    ⚠️ 别靠眼睛看 —— 俄语 / 越南语比中文长一半，出问题的往往是某一格里的一个词。
    放在探针页而不是每次往 console 里贴：reload 之后它还在，逐屏扫才跑得动。
  */
  window.__scan = async function () {
    const LANGS = ['zh', 'tw', 'en', 'ja', 'ko', 'vi', 'ru']
    const bad = []
    for (const L of LANGS) {
      lang.value = L
      await new Promise((r) => setTimeout(r, 90))
      const dlg = document.querySelector('.dlg')
      if (!dlg) { bad.push(L + ': 没有弹窗'); continue }
      for (const el of dlg.querySelectorAll('*')) {
        const cs = getComputedStyle(el)
        if (el.clientWidth > 0 && el.scrollWidth > el.clientWidth + 2 && cs.overflowX === 'visible') {
          bad.push(L + ' 横向溢出 ' + (el.className || el.tagName) + ' ' + el.scrollWidth + '/' + el.clientWidth)
        }
        /*
          ⚠️ 带<b>绝对定位子元素</b>的格子要跳过 —— 表头那条 7px 的列宽拖拽手柄
          （position: absolute）会把 scrollWidth 撑出 8px，而文字一个字都没被截。
          不排掉它，防火墙那张表七种语言全都会报「截断」，全是假的。
        */
        const hasAbs = [...el.children].some((c) => getComputedStyle(c).position === 'absolute')
        /*
          ⚠️ 「被省略号截了、但完整值悬停看得见」不算问题 —— 那是全项目既定的口径
          （仓库备注、映射的长地址、查重的位置列都是这么处理的）。
          判据：自己或某个祖先带着 data-tip / title，且那段文本<b>包含</b>本元素的全文。
          （自绘提示是全局摘除 title 的，所以要一起认 data-tip。）
        */
        const full = (el.textContent || '').trim()
        let tipped = false
        for (let a2 = el; a2 && a2 !== dlg; a2 = a2.parentElement) {
          const tip = a2.getAttribute('data-tip') || a2.getAttribute('title')
          if (tip && full && tip.includes(full)) { tipped = true; break }
        }
        if (!hasAbs && !tipped && el.clientWidth > 0 && cs.textOverflow === 'ellipsis' && cs.whiteSpace === 'nowrap' && el.scrollWidth > el.clientWidth + 1) {
          bad.push(L + ' 截断 ' + (el.className || el.tagName) + ' 「' + (el.textContent || '').trim().slice(0, 18) + '」')
        }
      }
      const b = dlg.querySelector('.bd')
      if (dlg.getBoundingClientRect().width > innerWidth) bad.push(L + ' 弹窗宽过视口')
      if (b && b.scrollWidth > b.clientWidth + 2) bad.push(L + ' 内容区横向溢出 ' + b.scrollWidth + '/' + b.clientWidth)
    }
    lang.value = 'zh'
    await new Promise((r) => setTimeout(r, 60))
    return bad.length ? [...new Set(bad)] : 'clean'
  }

  const httpMode = location.hash === '#http'
  //#data0 与 #data 同一屏，只差 getSystemCheck 给不给 httpAddr —— 验状态条那块端口牌的两支
  const dataPage = location.hash === '#data' || location.hash === '#data0'
  if (dataPage) {
    socks5Addr.value = '10.172.190.252:1080'
    httpAddr.value = location.hash === '#data0' ? '' : '10.172.190.252:1081'
  }
  const appPage = location.hash === '#app'
  const fwPage = location.hash === '#fw'
  const logPage = location.hash === '#log'
  const quickPage = location.hash === '#quick'
  const cliPage = location.hash === '#cli'
  const acctPage = location.hash === '#acct'
  //四档：#inject 有上次记录 · #inject0 还没注入过 · #injectbad 上次的目标已经没了 · #injectfail 这次注入失败
  const injectPage = location.hash === '#inject' || location.hash === '#inject0'
    || location.hash === '#injectbad' || location.hash === '#injectfail'
  if (injectPage) attachUiHost()   //注入失败会弹提示
  if (acctPage) {
    //乱序 + 有/无限制 + 有/无到期，用来验排序把「不限制 / 永不过期」排到最后
    useList(5).value = [
      { Id: 'a1', IsCheck: false, IsEnable: true,  UserName: 'zoe',  IsLimitLinks: true,  LimitLinks: 5,  IsLimitDevices: false, LimitDevices: 0, IsExpiry: true,  ExpiryTime: '2026-12-01 00:00:00', CreateTime: '', IsOnLine: false, LoginCount: 2 },
      { Id: 'a2', IsCheck: false, IsEnable: true,  UserName: 'amy',  IsLimitLinks: false, LimitLinks: 0,  IsLimitDevices: true,  LimitDevices: 2, IsExpiry: false, ExpiryTime: '', CreateTime: '', IsOnLine: true,  LoginCount: 9 },
      { Id: 'a3', IsCheck: false, IsEnable: false, UserName: 'bob',  IsLimitLinks: true,  LimitLinks: 12, IsLimitDevices: true,  LimitDevices: 1, IsExpiry: true,  ExpiryTime: '2026-10-02 00:00:00', CreateTime: '', IsOnLine: false, LoginCount: 0 },
    ]
  }
  if (logPage || quickPage) attachUiHost()   //清空要弹确认框

  if (quickPage) {
    //滤镜 / 发送 / 机器人 / 仓库四份，用来验右键菜单的四套动作
    useList(8).value = [{ Id: 'F1', IsEnable: true, Name: '登录包', ExecutionCount: 120 }, { Id: 'F2', IsEnable: false, Name: '心跳', ExecutionCount: 0 }, { Id: 'F3', IsEnable: true, Name: '聊天', ExecutionCount: 236 }]
    useList(9).value = [{ Id: 'S1', IsEnable: true, Name: '刷怪', ExecutionCount: 4 }]
    useList(10).value = [{ Id: 'R1', IsEnable: true, Name: '自动打怪', ExecutionCount: 9 }]
    useList(11).value = [{ Id: 'W1', Name: '登录包仓库', DataCount: 51 }]
  }

  if (cliPage) {
    //故意乱序 + 一个会让字符串排序出错的 IP 对（.9 / .10）
    useList(6).value = [
      { AccountId: 'A1', UserName: 'zhang', AuthIP: '10.10.10.10', IPLocation: '局域网', LinksNumber: 3, DevicesNumber: 1, TrafficStatistics: 2048, AuthResult: true, AuthTime: '2026-09-05 08:10:00' },
      { AccountId: 'A2', UserName: 'anna',  AuthIP: '10.10.10.9',  IPLocation: '局域网', LinksNumber: 12, DevicesNumber: 3, TrafficStatistics: 1048576, AuthResult: true, AuthTime: '2026-09-05 08:02:00' },
      { AccountId: 'A3', UserName: 'mike',  AuthIP: '203.0.113.7', IPLocation: '美国',   LinksNumber: 1, DevicesNumber: 1, TrafficStatistics: 512, AuthResult: true, AuthTime: '2026-09-05 08:20:00' },
    ]
  }

  if (logPage) {
    setTimeout(() => {
      const rows = [
        { Time: '08:00:01:0000000', FuncName: 'StartProxy', Content: 'SOCKS5 已启动 0.0.0.0:1080' },
        { Time: '08:00:02:0000000', FuncName: 'InitDB', Content: 'Exception: 打不开数据库' },
        { Time: '08:00:03:0000000', FuncName: 'RefreshAuthList', Content: '认证成功 10.10.10.8' },
      ]
      ls.forEach((cb) => cb({ data: { type: 'event', name: 'feed:append', data: { list: 2, rows } } }))
    }, 400)
  }
  if (fwPage) attachUiHost()   //确认框要靠它接 ask
  if (fwPage) useList(15).value = [
    { IPAddress: '10.10.10.8', StartIP: 0, EndIP: 0, IPLocation: '局域网', EffectCount: 3, IsExpiry: false, ExpiryTime: '', CreateTime: '2026-09-05 08:00:00' },
    { IPAddress: '203.0.113.7', StartIP: 0, EndIP: 0, IPLocation: '美国', EffectCount: 0, IsExpiry: true, ExpiryTime: '2026-09-06 08:00:00', CreateTime: '2026-09-05 08:00:00' },
  ]
  //三条提示条要并排看才比得出「统一了没有」
  const listsPage = location.hash === '#lists' || location.hash === '#lists0'
  if (listsPage) attachUiHost()
  const page = location.hash === '#panel' || httpMode
  const modify = location.hash === '#modify'
  const robot = location.hash === '#robot' || location.hash === '#robot0'   //#robot0：循环配不上对的那一份
  const sendEdit = location.hash === '#send' || location.hash === '#send0'
  const tool = { '#tc': TextCompare, '#xor': XorCalc, '#tr': Transcode, '#ex': ExtractData, '#stat': StatData, '#wpc': WpcConfig }[location.hash] || (settingComp ? {
    /*
      ⚠️ open 要从 false 翻成 true，不能一上来就 true。

      各设置屏的取数挂在 watch(() => props.open) 上，而那些 watch <b>没有 immediate</b> ——
      直接以 open: true 挂载，它一次都不会触发。别的屏因为 form 有默认值看不出来，
      代理设置却会卡在「取字节中…」（它的 s 在取到之前是 null）——
      于是那一屏在探针页里<b>从来没打开过</b>，一直只能靠真程序看。
    */
    setup: () => {
      const o = ref(false)
      onMounted(() => { o.value = true })
      return () => h(settingComp, { open: o.value, 'onUpdate:open': (v) => { if (!v) window.__closed = true } })
    },
  } : null)
  if (tool) { const NL = String.fromCharCode(10); textA.value = 'AA BB CC 11 22 AA BB CC' + NL + 'Hello World'; textB.value = 'AA 00 CC 11 22 AA BB CC' + NL + 'Hello there'; xorSrc.value = new Uint8Array([0x48, 0x65, 0x6c, 0x6c, 0x6f, 0x21]) }
  if (dataPage) {
    /*
      走真正的 feed 通道推假数据，形状与 C# 的 ProxyRow 逐字对齐。

      两处刻意的取值，别改回去：

      ① Action <b>大多数是 4（None）</b>。早先写的是「i % 7 ? 1 : 0」——
         0 是 Replace、1 是 Intercept，<b>两个都算命中</b>，于是 40 行全是命中行。
         命中行的格子走 .pl-row.hit .pl-cell { color: inherit }，
         「按列分层」那套语义配色<b>一次都没被画出来过</b> ——
         浅色模式下三列不可读就是这么漏过去的。现在只留几行命中。

      ② 类型里带上 <b>21 / 22（WebSocket 请求 / 响应）</b>。
         它们由 SunnyNetCallback 在 WebSocket 中间人那条路上产出，
         平时抓 TCP/UDP 撞不上；PACKET_TYPE 漏了这两个值时「类型」列是空白且不报错。
    */
    setTimeout(() => {
      const TYPES = [9, 17, 13, 15, 21, 22];
      const rows = Array.from({ length: 40 }, (_, i) => ({
        Id: 1000 + i, Time: '14:45:' + String(i % 60).padStart(2, '0') + ':0000000', Socket: 1200 + i,
        TheologyID: 0, Type: TYPES[i % TYPES.length], WebSocketType: i % 6 >= 4 ? 1 : 0,
        ClientAddr: '10.10.10.8:' + (60000 + i), ClientLocation: '局域网', ServerAddr: '93.184.216.34:443',
        ServerLocation: '美国', ServerDomain: 'example.com', DomainType: i % 4 === 0 ? 1 : 0,
        Len: 180 + i, Preview: '16 03 01 00 B4', Action: i % 11 === 0 ? 1 : 4,
      }));
      ls.forEach((cb) => cb({ data: { type: 'event', name: 'feed:append', data: { list: 1, rows } } }));
    }, 400);
  }

  createApp({ render: () => listsPage ? [h('div', { style: 'position:fixed;inset:0;display:flex;flex-direction:column' }, [
      h('div', { style: 'flex:1;display:flex;min-height:0' }, [h(FilterList)]),
      h('div', { style: 'flex:1;display:flex;min-height:0' }, [h(SendList)]),
      h('div', { style: 'flex:1;display:flex;min-height:0' }, [h(RobotList)]),
    ]), h(ConfirmDialog), h(ToastStack)] : injectPage ? [h('div', { style: 'position:fixed;inset:0;display:flex' }, [h(InjectView)]), h(ConfirmDialog), h(ToastStack)] : acctPage ? [h('div', { style: 'position:fixed;inset:0;display:flex' }, [h(AccountList)]), h(ToastStack)] : appPage ? [h(App)] : logPage ? [h('div', { style: 'position:fixed;inset:0;display:flex' }, [h(SystemLog)]), h(ConfirmDialog), h(ToastStack)] : quickPage ? [h('div', { style: 'position:fixed;inset:40px;width:320px' }, [h(QuickPanel)]), h(ToastStack)] : cliPage ? [h('div', { style: 'position:fixed;inset:0;display:flex' }, [h(ClientList)]), h(ToastStack)] : fwPage ? [h(FireWallSetting, { open: true, 'onUpdate:open': () => {} }), h(ConfirmDialog), h(ToastStack)] : tool ? [h('div', { style: 'position:fixed;inset:0;display:flex' }, [h(tool)]), h(ToastStack)] : sendEdit ? [h(SendEdit, { id: 'S1', onClose: () => { window.__closed = true } }), h(ToastStack)] : robot ? [h(RobotEdit, { id: 'R1', onClose: () => { window.__closed = true } }), h(ToastStack)] : modify ? [h(PacketModification, { id: 314, onClose: () => { window.__closed = true } }), h(ToastStack)] : dataPage ? [h('div', { style: 'position:fixed;inset:0;display:flex' }, [h(ProxyData)]), h(ToastStack)] : page ? [h('div', { style: 'position:fixed;inset:40px;display:flex' }, [h(HexPanel, { id: 314, packetType: httpMode ? 17 : 0, highlight: { offset: 9, length: 6 } })]), h(ToastStack)] : [h(PacketEdit, { target: { list: 'proxy', id: 1 }, onClose: () => { window.__closed = true } }), h(ToastStack)] }).mount('#app')
</script>
